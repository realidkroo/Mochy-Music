# every file of app text, so a translation platform sees all of it; new text goes into one of these, never into the code
# untranslated strings are left out of the exports: written as english copies, they hid the translations an older folder of the
# same language still had (vietnamese showed almost nothing in vietnamese, issue 217)
files:
  - source: /app/src/main/res/values/strings.xml
    skip_untranslated_strings: true
    translation: /app/src/main/res/values-%android_code%/strings.xml
  - source: /app/src/main/res/values/mochy_strings.xml
    skip_untranslated_strings: true
    translation: /app/src/main/res/values-%android_code%/mochy_strings.xml
