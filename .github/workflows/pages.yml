# puts the homepage and wiki in docs/ on github pages whenever they change on main
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a newer push replaces a deploy that's still going, so the site never ends up on an older copy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # the homepage stays in the repo but isn't ready yet, so the site opens straight on the wiki for now
      - name: Send the front page to the wiki
        run: |
          cp -r docs _site
          rm -rf _site/notes
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mochy Wiki</title><meta http-equiv="refresh" content="0; url=wiki/"><link rel="canonical" href="wiki/"></head><body style="background:#0e0e0f;color:#fff;font-family:system-ui"><a style="color:#f5e27a" href="wiki/">Mochy Wiki</a></body></html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
