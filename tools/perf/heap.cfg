# perfetto config for mochy memory: native heap samples from app start, for the profileable, fast or debug build
buffers: { size_kb: 131072 fill_policy: DISCARD }
data_sources: {
  config {
    name: "android.heapprofd"
    target_buffer: 0
    heapprofd_config {
      sampling_interval_bytes: 4096
      process_cmdline: "com.mochyy.mochymusic.profileable"
      process_cmdline: "com.mochyy.mochymusic.fast"
      process_cmdline: "com.mochyy.mochymusic.debug"
      shmem_size_bytes: 8388608
      block_client: true
    }
  }
}
data_sources: { config { name: "linux.process_stats" target_buffer: 0 process_stats_config { scan_all_processes_on_start: true } } }
duration_ms: 600000
